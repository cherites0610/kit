<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#EDEDED;font-family:'Noto Sans TC',sans-serif;color:#202020}
.top{background:#202020;color:#fff;padding:14px 18px;font-weight:900;font-size:18px}
main{padding:20px 18px}
h1{font-size:26px;font-weight:900}
.sub{font-size:14px;color:#555;margin:4px 0 16px}
.in{background:#fff;border:2px solid #202020;padding:12px;font:700 28px 'Noto Sans TC',monospace;letter-spacing:.2em}
.btn{margin-top:12px;background:#202020;color:#fff;text-align:center;font-weight:700;padding:13px;font-size:17px}
.slip{margin:22px 6px 0;background:#fff;padding:18px 18px 22px;box-shadow:0 2px 0 #bbb;font-family:monospace;position:relative}
.slip:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px,linear-gradient(-135deg,#fff 50%,transparent 50%) 0 0/12px 8px}
.slip h2{font-size:15px;text-align:center;letter-spacing:.2em}
.slip hr{border:0;border-top:2px dashed #999;margin:10px 0}
.slip .big{font-size:30px;font-weight:700;text-align:center;letter-spacing:.15em}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.ok{color:#202020;font-weight:700;text-align:center;font-size:20px}
.red{color:#D4202A}
.priv{margin-top:26px;font-size:12px;color:#555;text-align:center}
</style></head><body>
<div class="top">Cherites Kit</div>
<main>
<h1>統一編號驗證</h1>
<p class="sub">輸入 8 碼統一編號,立刻驗證。</p>
<div class="in">04596821</div>
<div class="btn">驗證</div>
<div class="slip">
<h2>驗證證明聯</h2><hr>
<div class="big">04596821</div>
<hr>
<div class="row"><span>檢查規則</span><span>通過</span></div>
<div class="row"><span>位數</span><span>8</span></div>
<div class="row"><span>加權總和</span><span>70</span></div>
<hr>
<div class="ok">格式正確 <span class="red">✓</span></div>
</div>
<div class="priv">資料只在你的瀏覽器處理,不會送出</div>
</main></body></html>
