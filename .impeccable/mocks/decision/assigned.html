<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F7F3E8;font-family:'Noto Sans TC',sans-serif;color:#1B1B18}
.bar{background:#00724A;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px;font-weight:900}.bar span{font-size:13px;opacity:.9}
.air{height:8px;background:repeating-linear-gradient(135deg,#D7261E 0 14px,#F7F3E8 14px 22px,#1E4A9C 22px 36px,#F7F3E8 36px 44px)}
main{padding:22px 18px}
.crumb{font-size:13px;color:#555}
h1{font-size:28px;font-weight:900;margin:6px 0 4px}
.sub{font-size:14px;color:#444;line-height:1.5}
.tabs{display:flex;margin:18px 0 14px;border-bottom:2px solid #1B1B18}
.tabs span{padding:9px 20px;font-size:15px;font-weight:700}
.tabs .on{background:#1B1B18;color:#F7F3E8}
label{font-size:14px;font-weight:700}
.boxes{display:flex;gap:6px;margin:8px 0 6px}
.boxes i{flex:1;height:54px;border:2px solid #D7261E;background:#fff;font:700 26px/50px 'Noto Sans TC';text-align:center;font-style:normal;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:#555}
.btn{margin-top:16px;background:#00724A;color:#fff;font-weight:700;font-size:17px;text-align:center;padding:14px;border-radius:6px}
.res{margin-top:20px;background:#00724A;color:#fff;padding:18px;border-radius:6px}
.res b{font-size:24px;font-weight:900;display:block}
.res p{font-size:14px;margin-top:6px;line-height:1.5}
.copy{margin-top:12px;display:inline-block;border:2px solid #fff;padding:6px 14px;font-size:13px;font-weight:700;border-radius:6px}
.priv{margin-top:18px;font-size:12px;color:#444;border-top:1px dashed #999;padding-top:10px}
</style></head><body>
<div class="bar"><b>Cherites Kit</b><span>全部工具</span></div><div class="air"></div>
<main>
<div class="crumb">首頁 › 統一編號</div>
<h1>統一編號驗證</h1>
<p class="sub">輸入 8 碼統一編號,立刻知道格式是否正確。</p>
<div class="tabs"><span class="on">驗證</span><span>生成</span></div>
<label>統一編號</label>
<div class="boxes"><i>0</i><i>4</i><i>5</i><i>9</i><i>6</i><i>8</i><i>2</i><i>1</i></div>
<div class="hint">貼上即可,不需要空格</div>
<div class="btn">驗證</div>
<div class="res"><b>通過 ✓</b><p>04596821 符合統一編號檢查規則。這只代表格式正確,不代表公司真實存在。</p><span class="copy">複製</span></div>
<div class="priv">🔒 資料只在你的瀏覽器處理,不會送出。</div>
</main></body></html>
